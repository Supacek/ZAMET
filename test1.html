<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>ZAMET NASTENKA</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

<!-- ================================================= -->
<!-- HLAVNÍ LAYOUT -->
<!-- ================================================= -->

<div id="main">

    <!-- ============================================= -->
    <!-- LEVÝ PANEL -->
    <!-- ============================================= -->

    <div id="sidebar">

    <!-- DATUM -->
    <section class="card card-date">
        <div class="card-icon blue">
            <icon name=calendar-range color=white size=2xl/>
        </div>

        <div class="card-content">
            <div id="date"></div>
        </div>
    </section>

    <!-- ČESKÝ SVÁTEK -->
    <section class="card">
        <div class="card-icon blue">
            <icon name=circle-user color=white size=2xl/>
        </div>

        <div class="card-content">
            <div id="nameday-title">Dnes má svátek</div>
            <div id="nameday"></div>
        </div>
    </section>

    <!-- UKRAJINSKÝ SVÁTEK -->
    <section class="card">
        <div class="card-icon yellow">
            <icon name=shield color=white size=2xl/>
        </div>

        <div class="card-content">
            <div id="ua-title">Ukrajinský svátek</div>
            <div id="ua-nameday"></div>
        </div>
    </section>

    <!-- STÁTNÍ SVÁTEK -->
    <section class="card">
        <div class="card-icon red">
            <icon name=calendar-heart color=white size=2xl/>
        </div>

        <div class="card-content">
            <div id="holiday-title">Nejbližší státní svátek</div>
            <div id="holiday"></div>
        </div>
    </section>

    <!-- VÁNOCE -->
    <section class="card">
        <div class="card-icon green">
            <icon name=tree-pine color=white size=2xl/>
        </div>

        <div class="card-content">
            <div id="countdown-title">Vánoce za</div>
            <div id="countdown"></div>
        </div>
    </section>

    <!-- DOVOLENÁ -->
    <section class="card">
        <div class="card-icon purple">
            <icon name=briefcase-business color=white size=2xl/>
        </div>

        <div class="card-content">
            <div id="vacation-title">Celozávodní dovolená</div>
            <div id="vacation"></div>
        </div>
    </section>

    <!-- POČASÍ -->
    <section class="card">
        <div class="card-icon cyan">
            <icon name=cloud color=white size=2xl/>
        </div>

        <div class="card-content">
            <div id="weather-title"></div>
            <div id="weather">Načítání...</div>
        </div>
    </section>

</div>

    <!-- ============================================= -->
    <!-- PRAVÁ ČÁST -->
    <!-- ============================================= -->

    <div id="content">

    <!-- TIMER -->

    <div id="slideTimer">

        <svg width="60" height="60">

            <circle
                cx="30"
                cy="30"
                r="26"
                class="timer-bg">
            </circle>

            <circle
                id="timerCircle"
                cx="30"
                cy="30"
                r="26"
                class="timer-progress">
            </circle>

        </svg>

        <span id="timerText">
            20
        </span>

    </div>

    <!-- OBRÁZEK -->

    <img
        id="slideImage"
        src=""
        alt="Obsah">

    <!-- IFRAME -->

    <iframe
        id="contentFrame"
        src=""
        frameborder="0">
    </iframe>

</div>
</div>

<!-- ================================================= -->
<!-- SPODNÍ LIŠTA -->
<!-- ================================================= -->

<div id="ticker-bar">

    <div id="ticker">
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

    <span class="ticker-green">Hledáme nové kolegy</span>

    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

    <span class="ticker-yellow">Kariéra ZAMET</span>

    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

    Více informací:
    <span class="ticker-yellow">karierazamet.cz</span>
    <span class="ticker-blue">Tel: +420 605 524 530</span>

    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

    <span class="ticker-orange">Nástup možný ihned</span>

    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
</div>

</div>

<!-- ================================================= -->
<!-- SVÁTKY -->
<!-- ================================================= -->

<script src="js/svatek.js"></script>
<script src="js/config.js"></script>
<script src="js/player.js"></script>
<script src="js/info.js"></script>
<script src="js/weather.js"></script>

</body>
</html>
