<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZAMET NÁSTĚNKA</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <div id="main">

        <!-- LEVÝ PANEL -->
        <aside id="sidebar">

            <!-- DATUM -->
            <section class="info-card date-card">
                <div class="icon-box blue">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <line x1="8" y1="3" x2="8" y2="7"></line>
                        <line x1="16" y1="3" x2="16" y2="7"></line>
                    </svg>
                </div>

                <div class="card-content">
                    <div id="date"></div>
                </div>
            </section>

            <!-- DNES MÁ SVÁTEK -->
            <section class="info-card">

                <!-- Česká vlajka -->
                <div class="icon-box flag-cz"></div>

                <div class="card-content">
                    <div id="nameday-title">DNES MÁ SVÁTEK</div>
                    <div id="nameday"></div>
                </div>

            </section>

            <!-- UKRAJINSKÝ SVÁTEK -->
            <section class="info-card">

                <!-- Ukrajinská vlajka -->
                <div class="icon-box flag-ua"></div>

                <div class="card-content">
                    <div id="ua-title">UKRAJINSKÝ SVÁTEK</div>
                    <div id="ua-nameday"></div>
                </div>

            </section>

            <!-- STÁTNÍ SVÁTEK -->
            <section class="info-card">
                <div class="icon-box red">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="4" y1="9" x2="20" y2="9"></line>
                        <path d="M9 14l2 2 4-4"></path>
                    </svg>
                </div>

                <div class="card-content">
                    <div id="holiday-title">NEJBLIŽŠÍ STÁTNÍ SVÁTEK</div>
                    <div id="holiday"></div>
                </div>
            </section>

            <!-- VÁNOCE -->
            <section class="info-card">
                <div class="icon-box green">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2l3 4h-2l3 4h-2l3 5H7l3-5H8l3-4H9l3-4z"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                </div>

                <div class="card-content">
                    <div id="countdown-title">VÁNOCE ZA</div>
                    <div id="countdown"></div>
                </div>
            </section>

            <!-- CELOZÁVODNÍ DOVOLENÁ -->
            <section class="info-card">
                <div class="icon-box purple">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="7" width="18" height="13" rx="2"></rect>
                        <path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                    </svg>
                </div>

                <div class="card-content">
                    <div id="vacation-title">CELOZÁVODNÍ DOVOLENÁ</div>
                    <div id="vacation"></div>
                </div>
            </section>

            <!-- POČASÍ -->
            <section class="info-card">
                <div class="icon-box cyan">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 18h10a4 4 0 000-8 5 5 0 00-9-2A4 4 0 007 18z"></path>
                    </svg>
                </div>

                <div class="card-content">
                    <div id="weather-title"></div>
                    <div id="weather">Načítání...</div>
                </div>
            </section>

        </aside>

        <!-- PRAVÁ ČÁST -->
        <main id="content">

            <!-- TIMER -->
            <div id="slideTimer">
                <svg viewBox="0 0 60 60">
                    <circle cx="30" cy="30" r="26" class="timer-bg"></circle>
                    <circle id="timerCircle" cx="30" cy="30" r="26" class="timer-progress"></circle>
                </svg>

                <span id="timerText">20</span>
            </div>

            <!-- OBRÁZKY -->
            <img id="slideImage" src="" alt="Obsah nástěnky">

            <!-- HTML stránky -->
            <iframe id="contentFrame" title="Obsah nástěnky"></iframe>

        </main>

    </div>

    <!-- SPODNÍ LIŠTA -->
    <footer id="ticker-bar">

        <div id="ticker">

            <span class="ticker-green">👥 Hledáme nové kolegy</span>

            <span class="divider">|</span>

            <span class="ticker-yellow">💼 Kariéra ZAMET</span>

            <span class="divider">|</span>

            Více informací:

            <span class="ticker-green">karierazamet.cz</span>

            <span class="divider">|</span>

            <span class="ticker-blue">📞 +420 605 524 530</span>

            <span class="divider">|</span>

            <span class="ticker-orange">🚨 Nástup možný ihned</span>

        </div>

    </footer>

    <!-- JAVASCRIPT -->
    <script src="js/config.js"></script>
    <script src="js/player.js"></script>
    <script src="js/svatek.js"></script>
    <script src="js/info.js"></script>
    <script src="js/weather.js"></script>

</body>

</html>
